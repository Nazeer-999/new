<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birthday Quiz for My Love</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      background-color: #000;
      color: white;
    }

    .page {
      display: none;
      padding: 20px;
      background-size: cover;
      background-position: center;
      height: 100vh;
      animation: fadeIn 1s forwards;
    }

    .active {
      display: block;
    }

    button {
      padding: 10px 20px;
      margin-top: 20px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background-color: #ff4081;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #e91e63;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="page active" id="page1" style="background-image: url('im1.jpg');">
    <h1>Happy Birthday, My Love! ❤️</h1>
    <p>Let’s start a cute quiz to celebrate you!</p>
    <button onclick="nextPage()">Start Quiz</button>
  </div>

  <div class="page" id="page2" style="background-image: url('im3.gif');">
    <h2>Question 1:</h2>
    <p>What is my favorite memory with you?</p>
    <button onclick="nextPage()">Next</button>
  </div>

  <!-- Add more pages as needed -->

  <script>
    let currentPage = 1;

    function showPage(pageNumber) {
      document.querySelectorAll('.page').forEach(p => {
        p.classList.remove('active');
      });
      const target = document.getElementById('page' + pageNumber);
      if (target) {
        target.classList.add('active');
        currentPage = pageNumber;
      }
    }

    function nextPage() {
      showPage(currentPage + 1);
    }
  </script>
</body>
</html>
